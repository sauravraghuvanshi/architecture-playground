name: Deploy to Azure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select Node for TypeScript contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Block deployment on application contract regressions
        run: |
          npm run prebuild
          npm run test:playground
          node --test scripts/test-hosted-validation-request.mjs
          node --test scripts/test-release.mjs
          npm run lint
          npx tsc --noEmit

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.400"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/artifact-validation/hcl/go.sum

      - name: Build trusted parser-only helpers
        run: npm run build:validators
        env:
          ARTIFACT_PARSER_TARGET: linux-x64
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      - name: Block deployment on real parser and script safety regressions
        run: |
          npm run test:artifact-parsers
          npm run test:powershell-preview
          npm run test:azure-cli-draft

      - name: Block unqualified AI subject changes
        run: |
          npm run test:ai-evaluations
          npm run evaluate:ai -- --gate --output node_modules/.cache/ai-evaluation/gate-report.json

      - name: Install pinned Terraform validator
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Install pinned Bicep compiler
        run: |
          mkdir -p "$RUNNER_TEMP/diagrammatic-tools"
          curl --fail --location --retry 3 https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64 -o "$RUNNER_TEMP/diagrammatic-tools/bicep"
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  $RUNNER_TEMP/diagrammatic-tools/bicep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/diagrammatic-tools/bicep"
          echo "$RUNNER_TEMP/diagrammatic-tools" >> "$GITHUB_PATH"

      - name: Block deployment on generated IaC compiler and provider regressions
        run: npm run test:iac-compilers

      - name: Restore the existing application build runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create runtime auth environment
        if: github.event_name != 'pull_request'
        env:
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
          APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
        run: |
          node -e 'const fs = require("fs"); const required = ["APP_AUTH_USERNAME", "APP_AUTH_PASSWORD", "APP_AUTH_SECRET"]; for (const key of required) { if (!process.env[key]) throw new Error(`Missing GitHub secret: ${key}`); } const encode = (value) => Buffer.from(value, "utf8").toString("base64url"); const settings = { APP_AUTH_ENABLED: "true", APP_AUTH_USERNAME_B64: encode(process.env.APP_AUTH_USERNAME), APP_AUTH_PASSWORD_B64: encode(process.env.APP_AUTH_PASSWORD), APP_AUTH_SECRET_B64: encode(process.env.APP_AUTH_SECRET) }; fs.writeFileSync(".env.production", Object.entries(settings).map(([key, value]) => `${key}=${value}`).join("\n") + "\n", { mode: 0o600 });'

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://architecture-playground.azurewebsites.net

      - name: Install release-gate browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Block deployment on architecture Whiteboard and AI workflow regressions
        run: node scripts/verify-screenshot-regressions.mjs --release

      - name: Create deploy zip
        if: github.event_name != 'pull_request'
        run: |
          cp .env.production .next/standalone/.env.production
          cd .next/standalone
          zip -r ../../deploy.zip . -x "node_modules/.cache/*"

      - name: Deploy to Azure
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_USER: ${{ secrets.AZURE_DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
        run: node scripts/deploy-zip.mjs

      - name: Verify exact deployed revision and build
        if: github.event_name != 'pull_request'
        env:
          LIVE_BASE_URL: https://architecture-playground.azurewebsites.net
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: node scripts/verify-release.mjs

      - name: Run authenticated live CSA API smoke
        if: github.event_name != 'pull_request'
        env:
          LIVE_BASE_URL: https://architecture-playground.azurewebsites.net
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: node scripts/smoke-live-csa.mjs

      - name: Verify hosted parser-only artifact validation
        if: github.event_name != 'pull_request'
        env:
          LIVE_BASE_URL: https://architecture-playground.azurewebsites.net
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: node scripts/smoke-engineering-validation.mjs

      - name: Run authenticated live CSA browser smoke
        if: github.event_name != 'pull_request'
        env:
          LIVE_E2E: "true"
          PLAYWRIGHT_BASE_URL: https://architecture-playground.azurewebsites.net
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          E2E_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          E2E_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: npx playwright test e2e/live-csa.spec.ts --project=chromium --reporter=line

      - name: Retain regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-regression-evidence
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
