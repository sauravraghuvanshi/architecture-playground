name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select Node for TypeScript contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Block deployment on application contract regressions
        run: npm run test:playground

      - name: Restore the existing application build runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.400"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/artifact-validation/hcl/go.sum

      - name: Build trusted parser-only helpers
        run: npm run build:validators
        env:
          ARTIFACT_PARSER_TARGET: linux-x64
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      - name: Create runtime auth environment
        env:
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
          APP_AUTH_SECRET: ${{ secrets.APP_AUTH_SECRET }}
        run: |
          node -e 'const fs = require("fs"); const required = ["APP_AUTH_USERNAME", "APP_AUTH_PASSWORD", "APP_AUTH_SECRET"]; for (const key of required) { if (!process.env[key]) throw new Error(`Missing GitHub secret: ${key}`); } const encode = (value) => Buffer.from(value, "utf8").toString("base64url"); const settings = { APP_AUTH_ENABLED: "true", APP_AUTH_USERNAME_B64: encode(process.env.APP_AUTH_USERNAME), APP_AUTH_PASSWORD_B64: encode(process.env.APP_AUTH_PASSWORD), APP_AUTH_SECRET_B64: encode(process.env.APP_AUTH_SECRET) }; fs.writeFileSync(".env.production", Object.entries(settings).map(([key, value]) => `${key}=${value}`).join("\n") + "\n", { mode: 0o600 });'

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://architecture-playground.azurewebsites.net

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Block deployment on screenshot workflow regressions
        run: node scripts/verify-screenshot-regressions.mjs

      - name: Create deploy zip
        run: |
          cp .env.production .next/standalone/.env.production
          cd .next/standalone
          zip -r ../../deploy.zip . -x "node_modules/.cache/*"

      - name: Deploy to Azure
        env:
          DEPLOY_USER: ${{ secrets.AZURE_DEPLOY_USER }}
          DEPLOY_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
        run: node scripts/deploy-zip.mjs

      - name: Verify deployment
        run: |
          echo "Waiting 30s for app restart..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://architecture-playground.azurewebsites.net/ || echo "000")
          LOGIN_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://architecture-playground.azurewebsites.net/ || echo "000")
          echo "Protected root HTTP status: $STATUS; followed redirect: $LOGIN_STATUS"
          if [ "$STATUS" -ne 307 ] || [ "$LOGIN_STATUS" -ne 200 ]; then
            echo "::error::Protected deployment is not healthy"
            exit 1
          fi

      - name: Run authenticated live CSA API smoke
        env:
          LIVE_BASE_URL: https://architecture-playground.azurewebsites.net
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: node scripts/smoke-live-csa.mjs

      - name: Verify hosted parser-only artifact validation
        env:
          LIVE_BASE_URL: https://architecture-playground.azurewebsites.net
          APP_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          APP_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: node scripts/smoke-engineering-validation.mjs

      - name: Run authenticated live CSA browser smoke
        env:
          LIVE_E2E: "true"
          PLAYWRIGHT_BASE_URL: https://architecture-playground.azurewebsites.net
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          E2E_AUTH_USERNAME: ${{ secrets.APP_AUTH_USERNAME }}
          E2E_AUTH_PASSWORD: ${{ secrets.APP_AUTH_PASSWORD }}
        run: npx playwright test e2e/live-csa.spec.ts --project=chromium --reporter=line
