<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300">
  <title>Synthetic Azure web and data request flow</title>
  <desc>Client sends HTTPS to Azure App Service. Azure App Service sends SQL to Azure SQL Database.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker></defs>
  <rect width="1020" height="300" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="510" y="42" font-size="25" font-weight="bold">Azure web and data request flow</text>
    <g stroke="#334155" stroke-width="2.5">
      <rect x="40" y="120" width="240" height="90" rx="8" fill="#f8fafc"/>
      <rect x="390" y="120" width="240" height="90" rx="8" fill="#eff6ff"/>
      <rect x="740" y="120" width="240" height="90" rx="8" fill="#eff6ff"/>
    </g>
    <g font-size="21">
      <text x="160" y="174">Client</text>
      <text x="510" y="174">Azure App Service</text>
      <text x="860" y="174">Azure SQL Database</text>
    </g>
    <g fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 280 165 L 382 165"/>
      <path d="M 630 165 L 732 165"/>
    </g>
    <g font-size="18">
      <text x="335" y="145">HTTPS</text>
      <text x="685" y="145">SQL</text>
    </g>
  </g>
</svg>
