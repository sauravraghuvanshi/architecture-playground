<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <title>Synthetic right-to-left archive flow</title>
  <desc>Azure Functions on the right archives data to Azure Blob Storage on the left. The arrow points left.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker></defs>
  <rect width="900" height="300" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="450" y="42" font-size="25" font-weight="bold">Archive data flow</text>
    <g stroke="#334155" stroke-width="2.5" fill="#eff6ff">
      <rect x="60" y="120" width="260" height="90" rx="8"/>
      <rect x="580" y="120" width="260" height="90" rx="8"/>
    </g>
    <g font-size="22">
      <text x="190" y="174">Azure Blob Storage</text>
      <text x="710" y="174">Azure Functions</text>
    </g>
    <path d="M 580 165 L 330 165" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="450" y="144" font-size="20">archive</text>
  </g>
</svg>
