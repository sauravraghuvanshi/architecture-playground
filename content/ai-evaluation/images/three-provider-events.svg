<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300">
  <title>Synthetic three-provider event pipeline</title>
  <desc>AWS Lambda publishes to Azure Event Hubs. Azure Event Hubs exports to GCP BigQuery.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker></defs>
  <rect width="1020" height="300" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="510" y="42" font-size="25" font-weight="bold">Three-provider event pipeline</text>
    <g stroke="#334155" stroke-width="2.5">
      <rect x="40" y="120" width="240" height="90" rx="8" fill="#fff7ed"/>
      <rect x="390" y="120" width="240" height="90" rx="8" fill="#eff6ff"/>
      <rect x="740" y="120" width="240" height="90" rx="8" fill="#f0fdf4"/>
    </g>
    <g font-size="21">
      <text x="160" y="174">AWS Lambda</text>
      <text x="510" y="174">Azure Event Hubs</text>
      <text x="860" y="174">GCP BigQuery</text>
    </g>
    <g fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 280 165 L 382 165"/>
      <path d="M 630 165 L 732 165"/>
    </g>
    <g font-size="18">
      <text x="335" y="145">publish</text>
      <text x="685" y="145">export</text>
    </g>
  </g>
</svg>
