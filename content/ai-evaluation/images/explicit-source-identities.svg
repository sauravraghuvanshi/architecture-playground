<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300">
  <title>Synthetic renamed services with explicit Whiteboard identities</title>
  <desc>The first box is labeled AWS Lambda but its supplied Whiteboard service identity is Azure App Service. The second is labeled Azure App Service but its supplied identity is AWS Lambda. The second box appends to the generic Audit log document.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/></marker></defs>
  <rect width="1020" height="300" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="510" y="42" font-size="25" font-weight="bold">Renamed service labels</text>
    <g stroke="#334155" stroke-width="2.5">
      <rect x="40" y="120" width="240" height="90" rx="8" fill="#f8fafc"/>
      <rect x="390" y="120" width="240" height="90" rx="8" fill="#f8fafc"/>
      <path d="M 740 120 H 955 L 980 145 V 210 H 740 Z M 955 120 V 145 H 980" fill="#fffbeb"/>
    </g>
    <g font-size="21">
      <text x="160" y="174">AWS Lambda</text>
      <text x="510" y="174">Azure App Service</text>
      <text x="860" y="174">Audit log</text>
    </g>
    <g fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 280 165 L 382 165"/>
      <path d="M 630 165 L 732 165"/>
    </g>
    <g font-size="18">
      <text x="335" y="145">invoke</text>
      <text x="685" y="145">append</text>
    </g>
  </g>
</svg>
